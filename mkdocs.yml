site_name: Portafolio | José Labrín
site_author: jlabrinp

theme:
  name: material
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    # Modo Claro (Estilo Kimi Light)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    # Modo Oscuro (Estilo Kimi Dark)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  features:
    - navigation.instant      # Transición suave sin recargar la página completa
    - navigation.tabs         # Pestañas de navegación superiores estilo app
    - navigation.tabs.sticky  # Pestañas fijas al hacer scroll
    - content.code.copy       # Botón interactivo para copiar código
    - content.action.edit     # Enlace rápido para editar la página

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:          # Permite pestañas interactivas dentro del contenido
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
