site_name: Portafolio
site_author: jlabrinp

theme:
  name: material
  font:
    text: Roboto
  features:
    - navigation.tabs
    - navigation.sections

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
