site_name: Portafolio de Cursos
theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.instant

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
