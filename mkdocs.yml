site_name: Portafolio | José Labrín
site_author: jlabrinp

theme:
  name: material
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    # Modo Claro (Estilo Kimi Light / Cream)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    # Modo Oscuro (Estilo Kimi Dark)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

extra_css:
  - stylesheets/custom.css
