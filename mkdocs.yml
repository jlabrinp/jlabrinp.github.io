site_name: Portafolio | José Labrín
site_author: jlabrinp

theme:
  name: material
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    # Modo Claro (Kimi Light / Cream)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    # Modo Oscuro (Kimi Dark)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  features:
    - navigation.instant      # Navegación fluida sin recargar la página
    - navigation.tabs         # Pestañas superiores de contenido
    - navigation.tabs.sticky  # Menú fijo al hacer scroll
    - content.code.copy

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details         # Secciones desplegables (??? note)
  - pymdownx.tabbed:          # Pestañas de contenido (===)
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
